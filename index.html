<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a0d" />
    <title>nipe.co</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="artwork">
      <svg id="signal" role="img" aria-label="Interactive living signal">
        <defs>
          <linearGradient id="signal-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#e2ff58" />
            <stop offset="27%" stop-color="#43e1c2" />
            <stop offset="53%" stop-color="#7770ff" />
            <stop offset="76%" stop-color="#f07bbd" />
            <stop offset="100%" stop-color="#ff7058" />
          </linearGradient>
          <linearGradient id="core-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f5ffb7" stop-opacity="0" />
            <stop offset="10%" stop-color="#f5ffb7" stop-opacity="0.55" />
            <stop offset="27%" stop-color="#c5fff4" />
            <stop offset="53%" stop-color="#dedcff" />
            <stop offset="76%" stop-color="#ffd0e8" />
            <stop offset="90%" stop-color="#ffc4bb" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#ffc4bb" stop-opacity="0" />
          </linearGradient>
          <pattern id="signal-pixels" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="transparent" />
            <rect x="1" y="1" width="2" height="2" fill="#ffffff" opacity="0.48" />
            <rect x="6" y="0" width="1" height="1" fill="#ffffff" opacity="0.28" />
            <rect x="4" y="4" width="2" height="1" fill="#ffffff" opacity="0.34" />
            <rect x="0" y="6" width="1" height="2" fill="#05060a" opacity="0.72" />
            <rect x="6" y="6" width="2" height="2" fill="#05060a" opacity="0.5" />
          </pattern>
          <filter id="soft-glow" x="-30%" y="-300%" width="160%" height="700%">
            <feGaussianBlur stdDeviation="18" />
          </filter>
        </defs>

        <path id="signal-glow" fill="url(#signal-gradient)" filter="url(#soft-glow)" />
        <path id="signal-ribbon" fill="url(#signal-gradient)" fill-rule="nonzero" />
        <path id="signal-texture" fill="url(#signal-pixels)" fill-rule="nonzero" />
        <g id="flow-lines" aria-hidden="true"></g>
        <path id="morse-stream" fill="none" stroke="url(#core-gradient)" aria-hidden="true" />
      </svg>
      <div class="grain" aria-hidden="true"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
